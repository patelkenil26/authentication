version: '3.8'

services:
  postgres:
    image: postgres:17
    container_name: auth-postgres
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin
      POSTGRES_DB: chaiauth
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
